<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="berryGrad" x1="25%" y1="7%" x2="75%" y2="93%">
      <stop offset="0%" stop-color="#A9BCFF" />
      <stop offset="34%" stop-color="#6C86F5" />
      <stop offset="68%" stop-color="#4254D6" />
      <stop offset="100%" stop-color="#2B2F8F" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0C0A13" />
  
  <!-- Crown -->
  <polygon points="256,60 278,110 338,95 292,145 315,195 256,160 197,195 220,145 174,95 234,110" fill="#1C1F66" />
  
  <!-- Blueberry Body -->
  <circle cx="256" cy="300" r="170" fill="url(#berryGrad)" />
  <circle cx="256" cy="300" r="170" fill="url(#shine)" />
  
  <!-- Cheeks -->
  <ellipse cx="180" cy="340" rx="36" ry="18" fill="#F3A6D8" opacity="0.6" />
  <ellipse cx="332" cy="340" rx="36" ry="18" fill="#F3A6D8" opacity="0.6" />
  
  <!-- Eyes -->
  <ellipse cx="205" cy="270" rx="38" ry="42" fill="#FFFFFF" />
  <ellipse cx="307" cy="270" rx="38" ry="42" fill="#FFFFFF" />
  
  <!-- Pupils -->
  <circle cx="215" cy="270" r="20" fill="#17151F" />
  <circle cx="208" cy="262" r="7" fill="#FFFFFF" />
  <circle cx="221" cy="276" r="3.5" fill="#FFFFFF" opacity="0.8" />
  
  <circle cx="317" cy="270" r="20" fill="#17151F" />
  <circle cx="310" cy="262" r="7" fill="#FFFFFF" />
  <circle cx="323" cy="276" r="3.5" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Eyebrows -->
  <path d="M 180,215 Q 205,200 230,215" stroke="#1C1F66" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 282,215 Q 307,200 332,215" stroke="#1C1F66" stroke-width="8" stroke-linecap="round" fill="none" />
  
  <!-- Nose/Mouth -->
  <ellipse cx="256" cy="335" rx="18" ry="12" fill="#1C1F66" />
</svg>
